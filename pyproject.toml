[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortica"
version = "0.1.0"
description = "A guided, reproducible workbench for EEG & fNIRS analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "samnemati", email = "samanemati.8891@gmail.com" }]
keywords = [
  "EEG", "fNIRS", "neuroimaging", "electrophysiology",
  "MNE", "reproducibility", "pipeline", "GUI", "neuroscience",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Core runtime: the analysis engine. The GUI is an optional extra so the
# headless pipeline/CLI can be installed without Qt.
dependencies = [
  "numpy",
  "scipy",
  "PyYAML",
  "mne>=1.6",
  "mne-nirs",
  "mne-connectivity",
  "scikit-learn",  # decoding, CSP, and cluster statistics
  "matplotlib",
  "pandas",        # behavioral-table import and brain-behavior stats
  "openpyxl",      # read behavioral data from Excel (.xlsx) files
  "PyWavelets",    # wavelet motion correction for fNIRS
]

[project.optional-dependencies]
# Desktop GUI: pip install cortica[gui]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
# Development (tests + lint + types): pip install cortica[dev]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4", "mypy>=1.8"]
# GUI tests — needs a Qt binding, so kept out of `dev`: pip install cortica[dev,gui,gui-test]
gui-test = ["pytest-qt"]
# Standalone installers: pip install cortica[packaging]
packaging = ["build", "briefcase"]

[project.scripts]
cortica = "cortica.cli:main"

[project.urls]
Homepage = "https://github.com/samnemati/cortica"
Repository = "https://github.com/samnemati/cortica"
Issues = "https://github.com/samnemati/cortica/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortica*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
