name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxcb-cursor0 libopengl0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,gui-test]"
      # Run here rather than in `test`: Qt is installed in this job, so the GUI
      # modules are checked against real PySide6 types instead of Any.
      - name: Types
        run: mypy cortica
      - name: Test (GUI, offscreen)
        run: >-
          pytest -q
          tests/test_gui_group.py
          tests/test_gui_ica.py
          tests/test_gui_main_window.py
          tests/test_gui_param_form.py
          tests/test_gui_runner.py
          tests/test_gui_state.py
